  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <h1>The Useless Machine</h1>
    <p>One switch. One surprise. Back to the start.</p>

    <div class="machine">
      <div class="box">
        <input type="checkbox" id="switch" class="sr-only">
        <label for="switch" class="toggle-label"><span class="knob"></span></label>
        <div class="hand" id="hand">🤚</div>
      </div>
      <p class="message" id="message">It is waiting for you to turn it on.</p>
      <p class="count">The machine has switched itself off <span id="count">0</span> time(s).</p>
    </div>

    <p class="note">A machine that does nothing — absolutely nothing — except switch itself off.</p>
